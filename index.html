<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <script>
      // 1. Immediately flag React Refresh preamble as installed to satisfy @vitejs/plugin-react
      window.__vite_plugin_react_preamble_installed__ = true;
      window.$RefreshReg$ = function() {};
      window.$RefreshSig$ = function() { return function(type) { return type; }; };

      // 2. Satisfy and suppress Vite HMR WebSocket in AI Studio iframe environment where HMR is disabled
      (function() {
        if (typeof window === 'undefined') return;
        try {
          var RealWebSocket = window.WebSocket;
          if (RealWebSocket) {
            function MockHmrWebSocket(url, protocols) {
              var listeners = {};
              var self = {
                readyState: 1, // OPEN
                url: url || '',
                protocol: Array.isArray(protocols) ? (protocols[0] || '') : (protocols || ''),
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() {
                  self.readyState = 3;
                  if (typeof self.onclose === 'function') {
                    try { self.onclose({ type: 'close', wasClean: true, code: 1000, reason: '' }); } catch(e) {}
                  }
                },
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open', target: self }); } catch(err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              setTimeout(function() {
                if (typeof self.onopen === 'function') {
                  try { self.onopen({ type: 'open', target: self }); } catch(err) {}
                }
              }, 0);
              return self;
            }

            MockHmrWebSocket.prototype = RealWebSocket.prototype;
            MockHmrWebSocket.CONNECTING = 0;
            MockHmrWebSocket.OPEN = 1;
            MockHmrWebSocket.CLOSING = 2;
            MockHmrWebSocket.CLOSED = 3;
            window.WebSocket = MockHmrWebSocket;
          }
        } catch (err) {}

        // Global suppression for any unhandled WebSocket close or connection error
        window.addEventListener('error', function(e) {
          var msg = e && (e.message || (e.error && e.error.message)) ? String(e.message || e.error.message) : '';
          if (msg.indexOf('WebSocket') !== -1) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason ? String(e.reason.message || e.reason) : '';
          if (reason.indexOf('WebSocket') !== -1) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
      })();
    </script>
